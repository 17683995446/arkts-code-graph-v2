<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArkTS 代码知识图谱可视化</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --accent: #3b82f6;
    --accent-light: #60a5fa;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #334155;
    --component: #3b82f6;
    --service: #10b981;
    --util: #f59e0b;
    --entry: #ef4444;
    --config: #8b5cf6;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Sidebar */
  .sidebar {
    width: 72px;
    background: linear-gradient(180deg, #0f172a 0%, #1a2332 100%);
    border-right: 1px solid var(--border);
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar:hover { width: 220px; }
  .sidebar .nav-text {
    opacity: 0;
    white-space: nowrap;
    transition: opacity 0.2s ease 0.1s;
  }
  .sidebar:hover .nav-text { opacity: 1; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    color: var(--text-secondary);
    position: relative;
  }
  .nav-item:hover {
    background: rgba(59, 130, 246, 0.08);
    color: var(--text-primary);
  }
  .nav-item.active {
    background: rgba(59, 130, 246, 0.12);
    border-left-color: var(--accent);
    color: var(--accent-light);
  }
  .nav-item svg { min-width: 24px; width: 24px; height: 24px; }

  /* Main content */
  .main-content {
    margin-left: 72px;
    height: 100vh;
    overflow-y: auto;
    background: var(--bg-primary);
  }

  /* Top bar */
  .top-bar {
    height: 60px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 40;
  }

  /* Tab panels */
  .tab-panel {
    display: none;
    animation: fadeIn 0.35s ease;
    padding: 24px 28px;
    min-height: calc(100vh - 60px);
  }
  .tab-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Cards */
  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    border-color: rgba(59, 130, 246, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(59, 130, 246, 0.1);
    transform: translateY(-2px);
  }

  /* Stat card */
  .stat-card {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(30, 41, 59, 0.8) 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
    transition: all 0.4s ease;
  }
  .stat-card:hover::after {
    top: -30%; right: -30%;
    width: 120%; height: 120%;
  }
  .stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    border-color: rgba(59, 130, 246, 0.3);
  }
  .stat-number {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Graph containers */
  .graph-container {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  .graph-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(30, 41, 59, 0.6);
  }

  /* Tree */
  .tree-node {
    padding-left: 20px;
    position: relative;
  }
  .tree-node::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s ease;
    position: relative;
    font-size: 0.875rem;
  }
  .tree-item::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    width: 12px;
    height: 1px;
    background: var(--border);
  }
  .tree-item:hover {
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent-light);
  }
  .tree-toggle {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
    font-size: 10px;
    color: var(--text-muted);
  }
  .tree-toggle.open { transform: rotate(90deg); }
  .tree-children { display: none; }
  .tree-children.open { display: block; }

  /* AI Panel */
  .ai-input-area {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .ai-message {
    padding: 14px 18px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.6;
    font-size: 0.9rem;
    animation: fadeIn 0.3s ease;
  }
  .ai-message.user {
    background: linear-gradient(135deg, #1e3a5f, #1e293b);
    border: 1px solid rgba(59, 130, 246, 0.2);
    margin-left: auto;
  }
  .ai-message.assistant {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
  }
  .ai-code-block {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    overflow-x: auto;
    white-space: pre-wrap;
    color: #e2e8f0;
  }

  /* Detail panel */
  .detail-panel {
    position: fixed;
    right: -420px;
    top: 60px;
    bottom: 0;
    width: 400px;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    z-index: 45;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
  }
  .detail-panel.open { right: 0; }

  /* Upload area */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 40px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.05);
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 500;
  }

  /* Glow effects */
  .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
  .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
  .glow-orange { box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
  .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); }
  .glow-purple { box-shadow: 0 0 20px rgba(139, 92, 246, 0.15); }

  /* Pulse animation */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); }
    50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
  }

  /* Loading spinner */
  .typing-indicator span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin: 0 2px;
    animation: typing 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* vis-network overrides */
  .vis-network { background: transparent !important; }
  .vis-network canvas { border-radius: 0 0 14px 14px; }

  /* Logo */
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: white;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* Method tag */
  .method-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.2);
    color: var(--accent-light);
    transition: all 0.15s ease;
  }
  .method-tag:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.4);
  }

  .call-arrow {
    color: var(--text-muted);
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div style="padding: 16px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); min-height: 60px;">
    <div class="logo-icon">K</div>
    <span class="nav-text" style="font-weight: 600; font-size: 1rem; white-space: nowrap;">知识图谱</span>
  </div>
  <div style="flex: 1; padding: 12px 0;">
    <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="nav-text">仪表盘</span>
    </div>
    <div class="nav-item" data-tab="callgraph" onclick="switchTab('callgraph')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')switchTab('callgraph')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><line x1="6" y1="7" x2="10" y2="10"/><line x1="18" y1="7" x2="14" y2="10"/><line x1="6" y1="17" x2="10" y2="14"/><line x1="18" y1="17" x2="14" y2="14"/></svg>
      <span class="nav-text">调用图谱</span>
    </div>
    <div class="nav-item" data-tab="nesting" onclick="switchTab('nesting')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')switchTab('nesting')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1"/><rect x="10" y="10" width="4" height="4" rx="0.5"/></svg>
      <span class="nav-text">组件嵌套</span>
    </div>
    <div class="nav-item" data-tab="tree" onclick="switchTab('tree')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')switchTab('tree')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18"/><path d="M6 8h6"/><path d="M6 14h6"/><path d="M12 8v2"/><path d="M12 14v2"/><path d="M18 8h-2"/><path d="M18 14h-2"/><circle cx="18" cy="8" r="1.5"/><circle cx="18" cy="14" r="1.5"/></svg>
      <span class="nav-text">代码树</span>
    </div>
    <div class="nav-item" data-tab="ai" onclick="switchTab('ai')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')switchTab('ai')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M16 14H8a6 6 0 0 0-6 6v2h20v-2a6 6 0 0 0-6-6z"/><path d="M11 6h2" stroke-dasharray="1 2"/></svg>
      <span class="nav-text">AI 查询</span>
    </div>
  </div>
  <div style="padding: 12px 0; border-top: 1px solid var(--border);">
    <div class="nav-item" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span class="nav-text">上传数据</span>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFileUpload(event)">
  </div>
</nav>

<!-- Main Content -->
<div class="main-content" id="mainContent">
  <!-- Top Bar -->
  <div class="top-bar">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="logo-icon" style="width: 32px; height: 32px; font-size: 14px; border-radius: 8px;">K</div>
      <div>
        <div style="font-weight: 600; font-size: 0.95rem;">ArkTS 代码知识图谱</div>
        <div style="font-size: 0.72rem; color: var(--text-muted);" id="dataInfo">内置示例数据 · 11 个文件 · 604 行代码</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="upload-zone" id="dropZone" style="padding: 6px 16px; border-width: 1px; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-secondary);"
           ondragover="event.preventDefault(); this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="handleDrop(event)"
           onclick="document.getElementById('fileInput').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        拖拽或点击上传 JSON
      </div>
    </div>
  </div>

  <!-- Dashboard Tab -->
  <div class="tab-panel active" id="tab-dashboard">
    <!-- Stats Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px;" id="statsCards">
    </div>

    <!-- Charts Row -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
      <div class="card">
        <div class="section-title" style="margin-bottom: 16px;">
          <span class="dot"></span>类类型分布
        </div>
        <div id="pieChart" style="width: 100%; height: 320px;"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-bottom: 16px;">
          <span class="dot"></span>各类方法数量
        </div>
        <div id="barChart" style="width: 100%; height: 320px;"></div>
      </div>
    </div>

    <!-- Quick Info -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="card">
        <div class="section-title" style="margin-bottom: 16px;">
          <span class="dot"></span>入口页面
        </div>
        <div id="entryList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-bottom: 16px;">
          <span class="dot"></span>调用关系最多的类
        </div>
        <div id="topCallers" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </div>
  </div>

  <!-- Call Graph Tab -->
  <div class="tab-panel" id="tab-callgraph">
    <div class="graph-container" style="height: calc(100vh - 108px);">
      <div class="graph-header">
        <div class="section-title">
          <span class="dot"></span>代码调用图谱
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span class="badge" style="background: rgba(59,130,246,0.15); color: #60a5fa;">组件</span>
          <span class="badge" style="background: rgba(16,185,129,0.15); color: #34d399;">服务</span>
          <span class="badge" style="background: rgba(245,158,11,0.15); color: #fbbf24;">工具</span>
          <span class="badge" style="background: rgba(139,92,246,0.15); color: #a78bfa;">配置</span>
          <span class="badge" style="background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3);">入口</span>
        </div>
      </div>
      <div id="callGraphNetwork" style="height: calc(100% - 56px);"></div>
    </div>
  </div>

  <!-- Component Nesting Tab -->
  <div class="tab-panel" id="tab-nesting">
    <div class="graph-container" style="height: calc(100vh - 108px);">
      <div class="graph-header">
        <div class="section-title">
          <span class="dot"></span>组件嵌套关系
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <span style="font-size: 0.82rem; color: var(--text-muted);">展示组件之间的嵌套层级关系</span>
        </div>
      </div>
      <div id="nestingNetwork" style="height: calc(100% - 56px);"></div>
    </div>
  </div>

  <!-- Tree Tab -->
  <div class="tab-panel" id="tab-tree">
    <div class="card" style="max-height: calc(100vh - 108px); overflow-y: auto;">
      <div class="graph-header" style="border: none; padding: 0 0 16px 0; background: transparent;">
        <div class="section-title">
          <span class="dot"></span>文件 / 类 / 方法树
        </div>
        <div style="display: flex; gap: 8px;">
          <button onclick="expandAllTree()" style="padding: 4px 12px; border-radius: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); font-size: 0.78rem; cursor: pointer;">全部展开</button>
          <button onclick="collapseAllTree()" style="padding: 4px 12px; border-radius: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); font-size: 0.78rem; cursor: pointer;">全部折叠</button>
        </div>
      </div>
      <div id="fileTree"></div>
    </div>
  </div>

  <!-- AI Query Tab -->
  <div class="tab-panel" id="tab-ai">
    <div style="display: grid; grid-template-columns: 1fr 360px; gap: 20px; height: calc(100vh - 108px);">
      <div class="ai-input-area" style="display: flex; flex-direction: column;">
        <div class="graph-header" style="border: none; background: transparent;">
          <div class="section-title">
            <span class="dot"></span>AI 智能查询
          </div>
        </div>
        <div id="aiMessages" style="flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;">
          <div class="ai-message assistant">
            你好！我是代码知识图谱 AI 助手。你可以用自然语言查询代码结构，例如：<br><br>
            <span style="color: var(--accent-light);">· "查询所有服务类的方法"</span><br>

function renderTopCallers() {
  const callCounts = {};
  appData.method_calls.forEach(mc => {
    if (!nonProjectClasses.includes(mc.caller_class) && !nonProjectClasses.includes(mc.callee_class)) {
      callCounts[mc.caller_class] = (callCounts[mc.caller_class] || 0) + 1;
      callCounts[mc.callee_class] = (callCounts[mc.callee_class] || 0) + 1;
    }
  });
  const sorted = Object.entries(callCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxCount = sorted[0] ? sorted[0][1] : 1;

  document.getElementById('topCallers').innerHTML = sorted.map(([name, count]) => {
    const cls = appData.classes.find(c => c.name === name);
    const color = cls ? getClassColor(cls) : '#64748b';
    const pct = (count / maxCount * 100).toFixed(0);
    return `
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: ${color};"></div>
        <span style="font-size: 0.85rem; min-width: 90px;">${name}</span>
        <div style="flex: 1; height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden;">
          <div style="width: ${pct}%; height: 100%; background: linear-gradient(90deg, ${color}60, ${color}); border-radius: 3px; transition: width 1s ease;"></div>
        </div>
        <span style="font-size: 0.78rem; color: var(--text-muted); min-width: 30px; text-align: right;">${count}</span>
      </div>
    `;
  }).join('');
}

// ==================== CALL GRAPH ====================
let callGraphInitialized = false;
let callGraphNetwork = null;

function initCallGraph() {
  callGraphInitialized = true;
  const container = document.getElementById('callGraphNetwork');

  // Build nodes
  const nodes = new vis.DataSet(
    appData.classes.map(cls => {
      const type = getClassType(cls);
      const color = getClassColor(cls);
      const methodCount = getMethodsForClass(cls.name).length;
      return {
        id: cls.name,
        label: cls.name,
        color: {
          background: type === 'entry' ? 'rgba(239,68,68,0.15)' : color + '25',
          border: color,
          highlight: {
            background: color + '40',
            border: color
          },
          hover: {
            background: color + '35',
            border: color
          }
        },
        borderWidth: type === 'entry' ? 3 : 2,
        borderWidthSelected: 3,
        font: { color: '#e2e8f0', size: 14, face: 'Inter', strokeWidth: 3, strokeColor: '#0f172a' },
        shape: 'dot',
        size: 18 + methodCount * 1.5,
        title: `<b>${cls.name}</b><br>类型: ${typeLabel(type)}<br>文件: ${cls.file_path}<br>方法数: ${methodCount}`,
        shadow: { enabled: true, color: color + '40', size: 12, x: 0, y: 0 }
      };
    })
  );

  // Build edges (filter non-project classes)
  const edgeSet = new Set();
  const edges = [];
  appData.method_calls.forEach(mc => {
    if (!nonProjectClasses.includes(mc.caller_class) && !nonProjectClasses.includes(mc.callee_class)) {
      const key = `${mc.caller_class}->${mc.callee_class}`;
      if (!edgeSet.has(key) && mc.caller_class !== mc.callee_class) {
        edgeSet.add(key);
        edges.push({
          from: mc.caller_class,
          to: mc.callee_class,
          arrows: { to: { enabled: true, scaleFactor: 0.7 } },
          color: { color: '#475569', highlight: '#60a5fa', hover: '#60a5fa' },
          width: 1,
          smooth: { type: 'curvedCW', roundness: 0.15 },
          hoverWidth: 2
        });
      }
    }
  });

  const options = {
    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -3000,
        centralGravity: 0.3,
        springLength: 140,
        springConstant: 0.04,
        damping: 0.09
      },
      stabilization: { iterations: 150 }
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      navigationButtons: false,
      keyboard: false
    },
    nodes: { chosen: true },
    edges: { chosen: true }
  };

  callGraphNetwork = new vis.Network(container, { nodes, edges }, options);

  callGraphNetwork.on('click', function(params) {
    if (params.nodes.length > 0) {
      showClassDetail(params.nodes[0]);
    }
  });
}

function typeLabel(type) {
  const map = { component: '组件', service: '服务', util: '工具', entry: '入口页面', config: '配置' };
  return map[type] || type;
}

let nestingInitialized = false;

function initNestingGraph() {
  nestingInitialized = true;
  const container = document.getElementById('nestingNetwork');

  // Collect all component names from nesting data
  const allNames = new Set();
  appData.component_nesting.forEach(n => { allNames.add(n.parent); allNames.add(n.child); });

  const nodes = new vis.DataSet(
    [...allNames].map(name => {
      const cls = appData.classes.find(c => c.name === name);
      const isEntry = cls && cls.is_entry;
      const color = cls ? getClassColor(cls) : '#64748b';
      const isParent = appData.component_nesting.some(n => n.parent === name);
      return {
        id: name,
        label: name,
        color: {
          background: isEntry ? 'rgba(239,68,68,0.15)' : color + '25',
          border: color,
          highlight: { background: color + '40', border: color },
          hover: { background: color + '35', border: color }
        },
        borderWidth: isEntry ? 3 : 2,
        font: { color: '#e2e8f0', size: 14, face: 'Inter', strokeWidth: 3, strokeColor: '#0f172a' },
        shape: 'box',
        size: isParent ? 30 : 22,
        margin: { top: 8, bottom: 8, left: 14, right: 14 },
        borderRadius: 8,
        shadow: { enabled: true, color: color + '30', size: 10 }
      };
    })
  );

  const edges = new vis.DataSet(
    appData.component_nesting.map(n => ({
      from: n.parent,
      to: n.child,
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#475569', highlight: '#60a5fa' },
      width: 1.5,
      smooth: { type: 'straight' },
      dashes: false
    }))
  );

  const options = {
    layout: {
      hierarchical: {
        enabled: true,
        direction: 'UD',
        sortMethod: 'directed',
        levelSeparation: 120,
        nodeSpacing: 80,
        blockShifting: true,
        edgeMinimization: true,
        shakeTowards: 'roots'
      }
    },
    physics: { enabled: false },
    interaction: {
      hover: true,
      tooltipDelay: 200
    }
  };

  const network = new vis.Network(container, { nodes, edges }, options);
  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      showClassDetail(params.nodes[0]);
    }
  });
}

function toggleTree(el) {
  const toggle = el.querySelector('.tree-toggle');
  const children = el.nextElementSibling;
  if (children && children.classList.contains('tree-children')) {
    toggle.classList.toggle('open');
    children.classList.toggle('open');
  }
}

function expandAllTree() {
  document.querySelectorAll('.tree-toggle').forEach(t => t.classList.add('open'));
  document.querySelectorAll('.tree-children').forEach(c => c.classList.add('open'));
}

function collapseAllTree() {
  document.querySelectorAll('.tree-toggle').forEach(t => t.classList.remove('open'));
  document.querySelectorAll('.tree-children').forEach(c => c.classList.remove('open'));
}

      const services = appData.classes.filter(c => c.file_path.startsWith('services/'));
      return {
        text: `项目中共有 <b>${services.length}</b> 个服务类：\n\n` + services.map(s => {
          const methods = getMethodsForClass(s.name);
          return `- <b>${s.name}</b> (${s.file_path}) — ${methods.length} 个方法`;
        }).join('\n'),
        sql: `SELECT name, file_path, COUNT(m.name) AS method_count\nFROM classes c\nLEFT JOIN methods m ON m.class_name = c.name\nWHERE c.file_path LIKE 'services/%'\nGROUP BY c.name`
      };
    }
  },
  {
    keywords: ['组件', 'component'],
    response: '组件列表：',
    getResult: () => {
      const components = appData.classes.filter(c => c.is_component);
      return {
        text: `项目中共有 <b>${components.length}</b> 个组件：\n\n` + components.map(c => {
          const type = getClassType(c);
          return `- <b>${c.name}</b> — ${typeLabel(type)} — ${c.file_path}`;
        }).join('\n'),
        sql: `SELECT name, file_path, is_entry, decorators\nFROM classes\nWHERE is_component = 1\nORDER BY is_entry DESC, name ASC`
      };
    }
  },
  {
    keywords: ['入口', 'entry'],
    response: '入口页面：',
    getResult: () => {
      const entries = appData.classes.filter(c => c.is_entry);
      return {
        text: `项目中有 <b>${entries.length}</b> 个入口页面：\n\n` + entries.map(e => {
          const methods = getMethodsForClass(e.name);
          return `- <b>${e.name}</b> (${e.file_path})\n  装饰器: @${e.decorators}\n  方法数: ${methods.length}`;
        }).join('\n\n'),
        sql: `SELECT name, file_path, decorators\nFROM classes\nWHERE is_entry = 1`
      };
    }
  },
  {
    keywords: ['UserService', '用户服务'],
    response: 'UserService 详情：',
    getResult: () => {
      const methods = getMethodsForClass('UserService');
      const calls = getCallsForClass('UserService');
      return {
        text: `<b>UserService</b> — services/UserService.ts\n\n方法列表 (${methods.length} 个)：\n` +
          methods.map(m => `  - ${m.name}(${m.params}) → ${m.return_type}`).join('\n') +
          `\n\n外部调用 (${calls.length} 个)：\n` +
          calls.map(c => `  - ${c.caller}() → ${c.callee_class}.${c.callee}()`).join('\n'),
        sql: `SELECT m.name, m.params, m.return_type\nFROM methods m\nWHERE m.class_name = 'UserService'\nORDER BY m.name`
      };
    }
  },
  {
    keywords: ['代码行', '行数', '统计'],
    response: '代码行数统计：',
    getResult: () => {
      const total = appData.files.reduce((s, f) => s + f.line_count, 0);
      return {
        text: `各文件代码行数：\n\n` + appData.files.sort((a, b) => b.line_count - a.line_count).map(f =>
          `- ${f.path}: <b>${f.line_count}</b> 行`
        ).join('\n') + `\n\n总计: <b>${total}</b> 行`,
        sql: `SELECT path, line_count\nFROM files\nORDER BY line_count DESC`
      };
    }
  },
  {
    keywords: ['调用', '关系', '依赖'],
    response: '调用关系统计：',
    getResult: () => {
      const filtered = appData.method_calls.filter(c => !nonProjectClasses.includes(c.caller_class) && !nonProjectClasses.includes(c.callee_class) && c.caller_class !== c.callee_class);
      const uniquePairs = [...new Set(filtered.map(c => `${c.caller_class}->${c.callee_class}`))];
      return {
        text: `项目内类间调用关系：\n\n` + uniquePairs.map(p => {
          const [from, to] = p.split('->');
          return `  <b>${from}</b> → <b>${to}</b>`;
        }).join('\n') + `\n\n共 <b>${uniquePairs.length}</b> 组调用关系，<b>${filtered.length}</b> 次方法调用`,
        sql: `SELECT caller_class, callee_class, COUNT(*) AS call_count\nFROM method_calls\nWHERE caller_class != callee_class\nGROUP BY caller_class, callee_class\nORDER BY call_count DESC`
      };
    }
  },
  {
    keywords: ['工具', 'util', '缓存', '日志', 'Logger', 'Cache'],
    response: '工具类详情：',
    getResult: () => {
      const utils = appData.classes.filter(c => c.file_path.startsWith('utils/'));
      return {
        text: `项目中共有 <b>${utils.length}</b> 个工具类：\n\n` + utils.map(u => {
          const methods = getMethodsForClass(u.name);
          return `- <b>${u.name}</b> (${u.file_path})\n  方法: ${methods.map(m => m.name).join(', ')}`;
        }).join('\n\n'),
        sql: `SELECT c.name, c.file_path, COUNT(m.name) AS method_count\nFROM classes c\nLEFT JOIN methods m ON m.class_name = c.name\nWHERE c.file_path LIKE 'utils/%'\nGROUP BY c.name`
      };
    }
  },
  {
    keywords: ['配置', 'config', 'AppConfig'],
    response: '配置类详情：',
    getResult: () => {
      const methods = getMethodsForClass('AppConfig');
      return {
        text: `<b>AppConfig</b> — config/AppConfig.ts\n\n方法列表 (${methods.length} 个)：\n` +
          methods.map(m => `  - ${m.name}(${m.params}) → ${m.return_type}`).join('\n') +
          `\n\n被以下类调用：\n` +
          getCallersOfClass('AppConfig').map(c => `  - ${c.caller_class}.${c.caller}() → AppConfig.${c.callee}()`).join('\n'),
        sql: `SELECT m.name, m.params, m.return_type\nFROM methods m\nWHERE m.class_name = 'AppConfig'`
      };
    }
  }
];

const defaultResponse = {
  text: '抱歉，我暂时无法理解你的问题。你可以尝试以下查询：\n\n- "查询所有服务类的方法"\n- "哪些组件是入口页面"\n- "统计各文件代码行数"\n- "UserService 调用了哪些外部方法"\n- "查询工具类详情"\n- "查看调用关系"',
  sql: null
};

function sendAIQuery() {
  const input = document.getElementById('aiInput');
  const query = input.value.trim();
  if (!query) return;

  input.value = '';
  const messages = document.getElementById('aiMessages');

  // Add user message
  messages.innerHTML += `<div class="ai-message user">${escapeHtml(query)}</div>`;

  // Show typing indicator
  const typingId = 'typing-' + Date.now();
  messages.innerHTML += `<div class="ai-message assistant" id="${typingId}"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  messages.scrollTop = messages.scrollHeight;

  // Simulate AI response
  setTimeout(() => {
    const result = getAIResponse(query);
    const typingEl = document.getElementById(typingId);
    if (typingEl) {
      let content = result.text.replace(/\n/g, '<br>');
      if (result.sql) {
        content += `<div class="ai-code-block">-- 等效 SQL 查询\n${escapeHtml(result.sql)}</div>`;
      }
      typingEl.innerHTML = content;
    }
    messages.scrollTop = messages.scrollHeight;
  }, 800 + Math.random() * 600);
}

function getAIResponse(query) {
  for (const r of aiResponses) {
    if (r.keywords.some(k => query.toLowerCase().includes(k.toLowerCase()))) {
      return r.getResult();
    }
  }
  return defaultResponse;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function initQuickQueries() {
  const queries = [
    { text: '查询所有服务类的方法', icon: '🛠' },
    { text: '哪些组件是入口页面', icon: '🏠' },
    { text: 'UserService 调用了哪些外部方法', icon: '🔗' },
    { text: '统计各文件代码行数', icon: '📊' },
    { text: '查看调用关系', icon: '🕸' },
    { text: '查询工具类详情', icon: '🔧' },
    { text: '配置类有哪些方法', icon: '⚙' },
    { text: '项目中有哪些组件', icon: '📦' }
  ];

  document.getElementById('quickQueries').innerHTML = queries.map(q => `
    <div style="padding: 10px 14px; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border); cursor: pointer; font-size: 0.84rem; color: var(--text-secondary); transition: all 0.2s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.borderColor='var(--accent)'; this.style.color='var(--text-primary)'" onmouseout="this.style.borderColor='var(--border)'; this.style.color='var(--text-secondary)'" onclick="document.getElementById('aiInput').value='${q.text}'; sendAIQuery();">
      <span>${q.text}</span>
    </div>
  `).join('');
}

// ==================== FILE UPLOAD ====================
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (file) loadJSONFile(file);
}

function handleDrop(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('dragover');
  const file = event.dataTransfer.files[0];
  if (file && file.name.endsWith('.json')) {
    loadJSONFile(file);
  }
}

function loadJSONFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.files && data.classes && data.methods) {
        appData = data;
        if (!data.stats) {
          data.stats = {
            files: data.files.length,
            classes: data.classes.length,
            methods: data.methods.length,
            method_calls: data.method_calls ? data.method_calls.length : 0,
            component_nesting: data.component_nesting ? data.component_nesting.length : 0,
            components: data.classes.filter(c => c.is_component).length,
            entries: data.classes.filter(c => c.is_entry).length,
            total_lines: data.files.reduce((s, f) => s + (f.line_count || 0), 0)
          };
        }
        // Reset states
        callGraphInitialized = false;
        nestingInitialized = false;
        treeInitialized = false;
        pieChartInstance = null;
        barChartInstance = null;

        // Reinitialize
        document.getElementById('dataInfo').textContent = `${file.name} · ${data.stats.files} 个文件 · ${data.stats.total_lines} 行代码`;
        initDashboard();
        initQuickQueries();
        closeDetailPanel();

        // Switch to dashboard
        switchTab('dashboard');
      } else {
        alert('JSON 格式不正确，请确保包含 files、classes、methods 字段');
      }
    } catch (err) {
      alert('JSON 解析失败: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ==================== RESIZE HANDLING ====================
window.addEventListener('resize', () => {
  if (pieChartInstance) pieChartInstance.resize();
  if (barChartInstance) barChartInstance.resize();
});

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  initDashboard();
  initQuickQueries();
});
</script>
